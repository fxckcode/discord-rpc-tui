<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="orange-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f54e00"/>
      <stop offset="100%" stop-color="#d04200"/>
    </linearGradient>
    <linearGradient id="bg-fade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f7f7f4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f7f7f4" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Canvas background circle -->
  <circle cx="200" cy="170" r="140" fill="#f7f7f4" stroke="#e6e5e0" stroke-width="1"/>

  <!-- Outer ring — "Presence" radar sweep -->
  <path d="M 200 70 A 100 100 0 1 1 110 120" stroke="#f54e00" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M 200 85 A 85 85 0 1 1 125 125" stroke="#f54e00" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 200 97 A 73 73 0 1 1 140 130" stroke="#f54e00" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Radar dot -->
  <circle cx="200" cy="70" r="4" fill="#f54e00"/>

  <!-- Central hexagon — Engineering precision -->
  <polygon points="200,120 230,136 230,168 200,184 170,168 170,136"
           fill="#26251e" stroke="none"/>

  <!-- Inner geometric "R" / node pattern -->
  <circle cx="200" cy="152" r="16" fill="#f7f7f4"/>
  <path d="M 191 152 L 200 152 L 205 143 M 200 152 L 205 161"
        stroke="#26251e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural connection dots (small accents) -->
  <circle cx="170" cy="136" r="2.5" fill="#f54e00" opacity="0.6"/>
  <circle cx="230" cy="136" r="2.5" fill="#f54e00" opacity="0.6"/>
  <circle cx="170" cy="168" r="2.5" fill="#f54e00" opacity="0.6"/>
  <circle cx="230" cy="168" r="2.5" fill="#f54e00" opacity="0.6"/>

  <!-- Small signal lines from hex corners -->
  <line x1="170" y1="136" x2="162" y2="128" stroke="#e6e5e0" stroke-width="1" stroke-linecap="round"/>
  <line x1="230" y1="136" x2="238" y2="128" stroke="#e6e5e0" stroke-width="1" stroke-linecap="round"/>
  <line x1="170" y1="168" x2="162" y2="176" stroke="#e6e5e0" stroke-width="1" stroke-linecap="round"/>
  <line x1="230" y1="168" x2="238" y2="176" stroke="#e6e5e0" stroke-width="1" stroke-linecap="round"/>

  <!-- Bottom typography -->
  <text x="200" y="310" text-anchor="middle" font-family="'Inter', system-ui, sans-serif"
        font-size="22" font-weight="400" letter-spacing="-0.44" fill="#26251e">
    Engineering Reality
  </text>

  <text x="200" y="335" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="12" font-weight="400" letter-spacing="2" fill="#807d72">
    DISCORD · RPC · TUI
  </text>
</svg>
