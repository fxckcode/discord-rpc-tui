<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f54e00"/>
      <stop offset="100%" stop-color="#d04200"/>
    </linearGradient>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26251e"/>
      <stop offset="100%" stop-color="#1a1915"/>
    </linearGradient>
  </defs>
  <!-- Canvas background -->
  <rect width="512" height="512" fill="#f7f7f4" rx="0"/>
  <!-- Hexagon mark -->
  <circle cx="256" cy="200" r="120" fill="#f7f7f4" stroke="#e6e5e0" stroke-width="1.5"/>
  <polygon points="256,110 325,150 325,230 256,270 187,230 187,150" fill="url(#bg)"/>
  <polygon points="256,155 281,180 256,205 231,180" fill="url(#og)"/>
  <!-- Signal rings -->
  <circle cx="256" cy="200" r="100" stroke="#f54e00" stroke-width="1" fill="none" opacity="0.1"/>
  <circle cx="256" cy="200" r="80" stroke="#f54e00" stroke-width="1.2" fill="none" opacity="0.15"/>
  <!-- Typography -->
  <text x="256" y="360" text-anchor="middle" font-family="'Inter', system-ui, sans-serif"
        font-size="48" font-weight="400" letter-spacing="-0.96" fill="#26251e">RPCraft</text>
  <text x="256" y="400" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="18" font-weight="400" letter-spacing="3" fill="#807d72">CRAFT YOUR DISCORD PRESENCE</text>
</svg>
